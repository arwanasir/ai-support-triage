# TODO(arwa): the previous TODO block that lived here is now mostly
# addressed (migrate service exists, depends_on wired up) — please
# delete it. Stale TODOs in committed code are confusing for future
# readers.
#
# Also: `.env.example` still ships `<your_db_user>`/`<your_password>`/
# etc. placeholders, so `cp .env.example .env && docker compose up`
# still requires hand-editing before it works. Ship sensible dev
# defaults (DB_USER=postgres, DB_PASSWORD=postgres, DB_NAME=triage_db)
# so the bootstrap is a single command.
name: triage-ai
services:
  app:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: triage_app
    restart: always
    volumes:
      - ./apps/api/src:/usr/src/app/apps/api/src

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    ports:
      - "3000:3000"

    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - triage-network

  db:
    image: postgres:16-alpine
    container_name: triage_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - triage-network

  redis:
    image: redis:7-alpine
    container_name: triage_redis
    restart: always

    ports:
      - "6379:6379"

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

    networks:
      - triage-network

  # TODO(arwa): this service currently exits 1 on `docker compose up`,
  # which also blocks `app` (it depends_on: migrate). Logs say:
  #
  #   npm warn exec The following package was not found and will be
  #     installed: drizzle-kit@0.31.10
  #   No config path provided, using default 'drizzle.config.json'
  #   /usr/src/app/drizzle.config.json file does not exist
  #
  # Two things going wrong, both fixable in this block:
  #
  #  a) The Dockerfile's WORKDIR is `/usr/src/app`, but drizzle-kit is
  #     installed under `apps/api/node_modules`. From `/usr/src/app`
  #     `npx` can't find it, so it downloads a fresh copy every time
  #     (slow and flaky on a plane / offline). Run from where the deps
  #     actually live:
  #         working_dir: /usr/src/app/apps/api
  #
  #  b) drizzle-kit defaults to looking for `drizzle.config.json`, but
  #     the repo has `drizzle.config.ts` at the root. Point at it
  #     explicitly:
  #         command: npx drizzle-kit push --config=../../drizzle.config.ts
  #
  # After both changes, the migrate step runs in ~1s, exits 0, and the
  # app starts cleanly.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: triage_migrate

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

    command: npx drizzle-kit push

    networks:
      - triage-network

volumes:
  postgres_data:

networks:
  triage-network:
    driver: bridge
