# TODO(arwa): config setup — nice job adding `.env.example`! Two things to
# tighten so a fresh clone actually boots end-to-end on `docker compose up`:
#
#  1. In `.env.example`, `REDIS_HOST=localhost` is wrong for the
#     dockerized flow. When the `app` container talks to Redis, it
#     resolves `redis` (the service name in this compose file) over the
#     docker network — `localhost` inside the container points at the
#     container itself, not the redis service. Change to:
#         REDIS_HOST=redis
#     (`localhost` would only be right if you ran `npm run dev` on your
#     host machine against host-installed redis.)
#     Bonus: shipping real dev defaults (e.g. DB_USER=postgres,
#     DB_PASSWORD=postgres, DB_NAME=triage_db) instead of `<placeholders>`
#     means `cp .env.example .env && docker compose up` just works,
#     no editing required.
#
#  2. Migrations never run automatically. The DB container starts empty,
#     so the first `POST /webhooks/tickets` crashes (table doesn't exist).
#     Add a one-shot `migrate` service that runs after `db: service_healthy`
#     and applies `drizzle/*.sql` — then `app` should `depends_on: migrate:
#     condition: service_completed_successfully`. After that, the whole
#     flow works end-to-end on a fresh clone with one command.
name: triage-ai
services:
  app:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: triage_app
    restart: always
    volumes:
      - ./apps/api/src:/usr/src/app/apps/api/src

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    ports:
      - "3000:3000"

    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - triage-network

  db:
    image: postgres:16-alpine
    container_name: triage_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - triage-network

  redis:
    image: redis:7-alpine
    container_name: triage_redis
    restart: always

    ports:
      - "6379:6379"

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

    networks:
      - triage-network

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: triage_migrate

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

    command: npx drizzle-kit push

    networks:
      - triage-network

volumes:
  postgres_data:

networks:
  triage-network:
    driver: bridge
